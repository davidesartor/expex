# Publishes to PyPI when a tag v* is pushed (git tag v0.1.0 && git push origin v0.1.0).
# One-time setup: on pypi.org, add a "trusted publisher" for this repository
# (owner davidesartor, repository expex, workflow publish.yml, environment pypi),
# and create the environment "pypi" in the repository's settings. No API token is needed.
name: publish
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install build twine
      - run: python -m build  # the sdist and the wheel, into dist/
      - run: twine check --strict dist/*
      - name: the tag matches the package version
        run: ls dist/expex-${GITHUB_REF_NAME#v}.tar.gz dist/expex-${GITHUB_REF_NAME#v}-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/expex
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
