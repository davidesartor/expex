[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typax"
version = "0.1.0"
description = "Shape-typed functions for JAX: annotations that are proved, checked and used."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["jax", "shapes", "typing", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["jax>=0.12", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "pyright", "mypy", "optax"]

[project.urls]
Repository = "https://github.com/davidesartor/typax"

[project.scripts]
typax = "typax.__main__:main"

[project.entry-points.pytest11]
typax = "typax.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/typax"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests/typing"]
pythonVersion = "3.12"
