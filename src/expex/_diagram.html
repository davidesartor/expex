<!doctype html>
<!-- The page expex.diagram(...).save("x.html") writes. _diagram.py fills in the title and the data: an SVG per view
     (each depth, and the views clicks reach), which call each click opens or folds, and the calls' details. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · expex diagram</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #5f6670; --panel: #f7f7f8; --border: #e1e3e6; --accent: #0057b7;
          --code: #f3f4f6; --bad: #c62828; color-scheme: light; }
  :root[data-theme="dark"] { --bg: #151519; --fg: #e6e7ea; --muted: #9da3ad; --panel: #1c1f25; --border: #2d323a;
          --accent: #7cb7ff; --code: #1f232a; --bad: #ff6b6b; color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #151519; --fg: #e6e7ea; --muted: #9da3ad; --panel: #1c1f25; --border: #2d323a;
          --accent: #7cb7ff; --code: #1f232a; --bad: #ff6b6b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 14px/1.45 Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px;
           border-bottom: 1px solid var(--border); }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 700; }
  button, select { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--border);
                   border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; min-width: 0; position: relative; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg); }
  #stage.dragging { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #stage g.nd.open, #stage g.pt, #stage g.st { cursor: pointer; }
  #stage g.nd.open:hover rect, #stage g.st:hover rect { stroke-width: 2.2px; }
  #stage g.pt:hover text { text-decoration: underline; }
  aside { width: 360px; max-width: 40%; border-left: 1px solid var(--border); background: var(--panel);
          padding: 12px 16px; overflow: auto; }
  aside h2 { font-size: 14px; margin: 0 0 6px; word-break: break-all; }
  aside h2.bad { color: var(--bad); }
  aside .muted { color: var(--muted); }
  pre { background: var(--code); border: 1px solid var(--border); border-radius: 6px; padding: 8px; overflow: auto;
        font: 12px/1.45 "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; }
  pre.msg { white-space: pre-wrap; word-break: break-word; }
  #tip { position: fixed; z-index: 10; pointer-events: none; max-width: min(480px, 90vw); padding: 8px 10px;
         background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
         box-shadow: 0 4px 16px rgba(0,0,0,.2); font: 12px/1.45 "JetBrains Mono", Menlo, monospace; white-space: pre-wrap; }
  @media (max-width: 720px) {
    main { flex-direction: column; }
    aside { width: auto; max-width: none; max-height: 38%; border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <label class="hint">depth <select id="depth"></select></label>
  <button id="fit">Fit</button>
  <button id="theme" title="Colour scheme">Auto</button>
  <button id="download">SVG</button>
  <span class="hint">Click a call to open or fold it · drag to pan · wheel to zoom</span>
</header>
<main>
  <div id="stage"></div>
  <aside id="panel"></aside>
</main>
<div id="tip" hidden></div>
<script>
const M = /*DATA*/null;
const stage = document.getElementById("stage"), tip = document.getElementById("tip"), panel = document.getElementById("panel");
const esc = s => String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"})[c]);
let key = M.start, vb = null, base = null, drag = null, moved = false;

// The SVG carries its light and dark colours; data-theme on <html> overrides the system setting.
const themes = ["auto", "light", "dark"];
let theme = "auto";
try { theme = localStorage.getItem("expex-diagram-theme") || "auto"; } catch (e) {}
function setTheme(t) {
  theme = t;
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.getElementById("theme").textContent = t[0].toUpperCase() + t.slice(1);
  try { localStorage.setItem("expex-diagram-theme", t); } catch (e) {}
}
setTheme(theme);
document.getElementById("theme").onclick = () => setTheme(themes[(themes.indexOf(theme) + 1) % 3]);

const amount = (x, unit) => {
  if (unit === "s") {
    for (const [sc, n] of [[1, "s"], [1e-3, "ms"], [1e-6, "µs"]]) if (x >= sc) return +(x / sc).toPrecision(3) + " " + n;
    return +(x * 1e9).toPrecision(3) + " ns";
  }
  for (const [sc, n] of [[1e12, "T"], [1e9, "G"], [1e6, "M"], [1e3, "k"]]) if (x >= sc) return +(x / sc).toPrecision(3) + " " + n + "FLOP";
  return +x.toPrecision(3) + " FLOP";
};
const pct = s => (100 * s).toFixed(1) + "%";
function timeText(b) {
  const T = M.timing;
  if (!T || b.t == null) return "";
  if (T.unit !== "s") return `estimated: ${amount(b.t, T.unit)} per call, ${pct(b.s)} of the FLOPs (not measured)`;
  return `time: ${amount(b.t, "s")} per call, ${pct(b.s)} of ${amount(T.total, "s")}` + (b.n ? `, ${Math.round(b.n)} XLA op runs` : "");
}
function describe(g) {
  const i = +g.dataset.box;
  if (g.dataset.id && !(i >= 0)) {  // an operation, input or output
    const label = g.querySelector("text") ? [...g.querySelectorAll("text")].map(t => t.textContent).join("\n") : "";
    if (M.error && g.querySelector(".f-err")) return M.error.message;
    return label;
  }
  const b = M.boxes[i];
  if (!b) return "";
  if (b.err === 2 && M.error) return M.error.message;
  const parts = [b.sig || b.name, `${b.ins} → ${b.outs || "?"}` + (b.vectorize ? "   (per element: called with .vectorize)" : ""), b.loc];
  const t = timeText(b);
  if (t) parts.push(t);
  if (b.err === 1 && M.error) parts.push("✗ the failing call is inside: " + M.error.head);
  if (b.o) parts.push(g.classList.contains("fold") || g.classList.contains("pt") ? "click to fold" : "click to open");
  return parts.filter(Boolean).join("\n");
}
function details(i) {
  const b = M.boxes[i], src = M.sources[b.src] || "";
  const err = b.err === 2 && M.error ? `<pre class="msg">${esc(M.error.message)}</pre>` : "";
  const t = timeText(b);
  panel.innerHTML = `<h2${b.err === 2 ? ' class="bad"' : ""}>${b.err === 2 ? "✗ " : ""}${esc(b.name)}</h2><p>${esc(b.sig)}</p>`
    + `<p class="muted">${esc(b.ins)} → ${esc(b.outs || "?")}${b.vectorize ? " (per element, via .vectorize)" : ""}`
    + `<br>${esc(b.loc)}${t ? "<br>" + esc(t) : ""}</p>${err}${src ? `<pre>${esc(src)}</pre>` : ""}`;
}
function intro() {
  if (M.error) {
    panel.innerHTML = `<h2 class="bad">✗ ShapeError</h2><p class="muted">The trace stopped at the failing call (red); `
      + `the red edges lead to it from the inputs.</p><pre class="msg">${esc(M.error.message)}</pre>`;
  } else panel.innerHTML = `<h2>${esc(M.name)}</h2><p class="muted">Hover a box for its signature, shapes and source `
      + `location; click a call to open it in place and see its source here.</p><pre>${esc(M.text)}</pre>`;
}

function show(k, anchor) {
  key = k;
  stage.innerHTML = M.svgs[k];
  const el = stage.querySelector("svg");
  const [x, y, w, h] = el.getAttribute("viewBox").split(/[ ,]+/).map(Number);
  el.removeAttribute("width"); el.removeAttribute("height");
  el.setAttribute("preserveAspectRatio", "xMidYMid meet");
  base = {x, y, w, h};
  const minW = stage.clientWidth / 1.5, minH = stage.clientHeight / 1.5;  // small figures: at most 1.5x
  if (base.w < minW && base.h < minH) {
    const s = Math.max(base.w / minW, base.h / minH);
    base = {x: base.x - (minW * s - base.w) / 2, y: base.y, w: minW * s, h: minH * s};
  }
  if (anchor && vb) {  // keep the clicked call where it was on the screen, zoomed out if the figure grew
    const g = el.querySelector(`[data-box="${anchor.box}"]`);
    const grow = Math.max(1, base.w / vb.w, base.h / vb.h);
    vb = {...vb, w: vb.w * grow, h: vb.h * grow};
    setViewBox();
    if (g) {
      const r = g.getBoundingClientRect(), s = el.getScreenCTM().a;
      vb = {...vb, x: vb.x + (r.left - anchor.left) / s, y: vb.y + (r.top - anchor.top) / s};
    }
    const clamp = (v, lo, hi) => Math.min(Math.max(v, Math.min(lo, hi)), Math.max(lo, hi));
    vb.x = clamp(vb.x, base.x + base.w - vb.w, base.x);  // and the whole figure in view, if it fits
    vb.y = clamp(vb.y, base.y + base.h - vb.h, base.y);
  } else vb = {...base};
  setViewBox();
  wire(el);
  document.getElementById("depth").value = String(M.depths.indexOf(k) + 1 || "");
}
function setViewBox() {
  const el = stage.querySelector("svg");
  if (el && vb) el.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}
function wire(el) {
  for (const g of el.querySelectorAll("g.nd, g.pn, g.pt, g.st")) {
    const i = g.dataset.box;
    g.addEventListener("mousemove", ev => {
      tip.textContent = describe(g);
      tip.hidden = !tip.textContent;
      tip.style.left = Math.max(4, Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8)) + "px";
      tip.style.top = Math.max(4, Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8)) + "px";
      ev.stopPropagation();
    });
    g.addEventListener("mouseleave", () => { tip.hidden = true; });
    if (!(+i >= 0)) continue;
    g.addEventListener("click", ev => {
      if (moved) return;
      ev.stopPropagation();
      details(+i);
      const to = (M.clicks[key] || {})[i];
      if (!to || to === key || g.classList.contains("pn")) return;
      const r = g.getBoundingClientRect();
      tip.hidden = true;
      show(to, g.classList.contains("st") ? null : {box: i, left: r.left, top: r.top});
    });
  }
}

stage.addEventListener("wheel", ev => {
  if (!vb) return;
  ev.preventDefault();
  const el = stage.querySelector("svg"), p = el.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  const q = p.matrixTransform(el.getScreenCTM().inverse()), f = Math.exp(ev.deltaY * 0.0015);
  vb = {x: q.x - (q.x - vb.x) * f, y: q.y - (q.y - vb.y) * f, w: vb.w * f, h: vb.h * f};
  setViewBox();
}, {passive: false});
stage.addEventListener("pointerdown", ev => {
  if (!vb || ev.button !== 0) return;
  drag = {x: ev.clientX, y: ev.clientY, vb: {...vb}}; moved = false;
});
addEventListener("pointermove", ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 4) return;
  moved = true; stage.classList.add("dragging"); tip.hidden = true;
  const s = stage.querySelector("svg").getScreenCTM().a;
  vb = {...drag.vb, x: drag.vb.x - dx / s, y: drag.vb.y - dy / s};
  setViewBox();
});
addEventListener("pointerup", () => { drag = null; stage.classList.remove("dragging"); setTimeout(() => { moved = false; }, 0); });

const depthSel = document.getElementById("depth");
M.depths.forEach((k, d) => depthSel.add(new Option(String(d + 1), String(d + 1))));
depthSel.addEventListener("change", () => show(M.depths[+depthSel.value - 1]));
document.getElementById("fit").onclick = () => { vb = base && {...base}; setViewBox(); };
document.getElementById("download").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([M.svgs[key]], {type: "image/svg+xml"}));
  a.download = M.name.replace(/[^\w.-]+/g, "_") + ".svg";
  a.click();
};
addEventListener("resize", () => show(key));
intro();
show(key);
</script>
</body>
</html>
