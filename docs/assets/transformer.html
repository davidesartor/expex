    base = {x: base.x - (minW * s - base.w) / 2, y: base.y, w: minW * s, h: minH * s};

  if (anchor && vb) {  // keep the clicked call where it was on the screen, zoomed out if the figure grew
    const g = el.querySelector(`[data-box="${anchor.box}"]`);
    const grow = Math.max(1, base.w / vb.w, base.h / vb.h);
    vb = {...vb, w: vb.w * grow, h: vb.h * grow};
    setViewBox();
    if (g) {
      const r = g.getBoundingClientRect(), s = el.getScreenCTM().a;
      vb = {...vb, x: vb.x + (r.left - anchor.left) / s, y: vb.y + (r.top - anchor.top) / s};
    }
    const clamp = (v, lo, hi) => Math.min(Math.max(v, Math.min(lo, hi)), Math.max(lo, hi));
    vb.x = clamp(vb.x, base.x + base.w - vb.w, base.x);  // and the whole figure in view, if it fits
    vb.y = clamp(vb.y, base.y + base.h - vb.h, base.y);
  } else vb = {...base};
  setViewBox();
  wire(el);
  document.getElementById("depth").value = String(M.depths.indexOf(k) + 1 || "");
}
function setViewBox() {
  const el = stage.querySelector("svg");
  if (el && vb) el.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}
function wire(el) {
  for (const g of el.querySelectorAll("g.nd, g.pn, g.pt, g.st")) {
    const i = g.dataset.box;
    g.addEventListener("mousemove", ev => {
      tip.textContent = describe(g);
      tip.hidden = !tip.textContent;
      tip.style.left = Math.max(4, Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8)) + "px";
      tip.style.top = Math.max(4, Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8)) + "px";
      ev.stopPropagation();
    });
    g.addEventListener("mouseleave", () => { tip.hidden = true; });
    if (!(+i >= 0)) continue;
    g.addEventListener("click", ev => {
      if (moved) return;
      ev.stopPropagation();
      details(+i);
      tell(+i);
      const to = (M.clicks[key] || {})[i];
      if (!to || to === key || g.classList.contains("pn")) return;
      const r = g.getBoundingClientRect();
      tip.hidden = true;
      show(to, g.classList.contains("st") ? null : {box: i, left: r.left, top: r.top});
      mark(+i);
    });
  }
}

stage.addEventListener("wheel", ev => {
  if (!vb) return;
  ev.preventDefault();
  const el = stage.querySelector("svg"), p = el.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  const q = p.matrixTransform(el.getScreenCTM().inverse()), f = Math.exp(ev.deltaY * 0.0015);
  vb = {x: q.x - (q.x - vb.x) * f, y: q.y - (q.y - vb.y) * f, w: vb.w * f, h: vb.h * f};
  setViewBox();
}, {passive: false});
stage.addEventListener("pointerdown", ev => {
  if (!vb || ev.button !== 0) return;
  drag = {x: ev.clientX, y: ev.clientY, vb: {...vb}}; moved = false;
});
addEventListener("pointermove", ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 4) return;
  moved = true; stage.classList.add("dragging"); tip.hidden = true;
  const s = stage.querySelector("svg").getScreenCTM().a;
  vb = {...drag.vb, x: drag.vb.x - dx / s, y: drag.vb.y - dy / s};
  setViewBox();
});
addEventListener("pointerup", () => { drag = null; stage.classList.remove("dragging"); setTimeout(() => { moved = false; }, 0); });

const depthSel = document.getElementById("depth");
M.depths.forEach((k, d) => depthSel.add(new Option(String(d + 1), String(d + 1))));
depthSel.addEventListener("change", () => show(M.depths[+depthSel.value - 1]));
document.getElementById("fit").onclick = () => { vb = base && {...base}; setViewBox(); };
document.getElementById("download").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([M.svgs[key]], {type: "image/svg+xml"}));
  a.download = M.name.replace(/[^\w.-]+/g, "_") + ".svg";
  a.click();
};
addEventListener("resize", () => { show(key); if (selected !== null) reveal(selected); });

// Embedded in expex.inspect's page, which sends the theme and the module to show
// ({expex: "select", path: "blocks[*].attn"}), and hears which module a click selects.
let selected = null;
const norm = p => p == null ? null : String(p).replace(/\[\d+\]/g, "[*]");
const ids = k => k.split(",").filter(Boolean).map(Number);
function mark(i) {
  stage.querySelectorAll("g.sel").forEach(g => g.classList.remove("sel"));
  const g = i >= 0 && stage.querySelector(`g.pn[data-box="${i}"], g.nd[data-box="${i}"]`);
  if (g) g.classList.add("sel");
  return g;
}
function tell(i) {
  const path = norm(M.boxes[i] && M.boxes[i].path);
  if (window.parent !== window && path !== null) {
    selected = path;
    window.parent.postMessage({expex: "select", path, from: "diagram"}, "*");
  }
}
function reveal(path) {
  selected = path;
  let best = -1;  // the module's call box, its __call__ if it has several
  M.boxes.forEach((b, i) => {
    if (b.k === "call" && norm(b.path) === path && (best < 0 || (/__call__$/.test(b.name) && !/__call__$/.test(M.boxes[best].name)))) best = i;
  });
  if (best < 0) { mark(-1); if (base) { vb = {...base}; setViewBox(); } return; }
  const need = M.boxes[best].o ? [best] : [];  // the calls around it, and itself if it has an inside
  for (let p = M.boxes[best].p; p >= 0; p = M.boxes[p].p) if (M.boxes[p].k === "call") need.push(p);
  const want = [...new Set([...ids(key), ...need])].sort((a, b) => a - b).join(",");
  let to = M.svgs[want] !== undefined ? want : null;
  if (to === null) {  // past the views the page holds: the smallest one that shows it
    const fits = Object.keys(M.svgs).filter(k => need.every(i => ids(k).includes(i)));
    fits.sort((a, b) => ids(a).length - ids(b).length);
    to = fits.length ? fits[0] : key;
  }
  if (to !== key) show(to);
  const g = mark(best), el = stage.querySelector("svg");
  details(best);
  if (!g || !el || !stage.clientWidth) return;
  // centred, and zoomed so that it fills about half the view (no closer than 4x the whole figure)
  const r = g.getBoundingClientRect(), s = stage.getBoundingClientRect(), p = el.createSVGPoint();
  p.x = r.left + r.width / 2; p.y = r.top + r.height / 2;
  const q = p.matrixTransform(el.getScreenCTM().inverse());
  let f = Math.max(r.width / (s.width * 0.55), r.height / (s.height * 0.55));
  f = Math.min(Math.max(f, base.w / 4 / vb.w), Math.max(base.w / vb.w, base.h / vb.h, 1));
  vb = {x: q.x - vb.w * f / 2, y: q.y - vb.h * f / 2, w: vb.w * f, h: vb.h * f};
  setViewBox();
}
addEventListener("message", ev => {
  const d = ev.data;
  if (ev.source !== window.parent || !d || typeof d !== "object") return;
  if (d.expex === "theme") { setTheme(d.theme, false); document.getElementById("theme").hidden = true; }
  if (d.expex === "select") reveal(d.path);
});
intro();
show(key);
</script>
